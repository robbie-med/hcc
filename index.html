<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HCC Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230a6b70%22%2F%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M9%208h4v6h6V8h4v16h-4v-6h-6v6H9z%22%2F%3E%3C%2Fsvg%3E">
<style>
:root { --bg: #fff; --fg: #111; --muted: #666; --line: #ccc; --accent: #0a6b70; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111; --fg: #ddd; --muted: #999; --line: #444; --accent: #5fc3c6; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #111; --fg: #ddd; --muted: #999; --line: #444; --accent: #5fc3c6; color-scheme: dark; }
body { margin: 0; padding: 16px 16px 120px; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
h1 { font-size: 22px; margin: 0; }
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.prefs { position: relative; }
.prefs summary { list-style: none; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: conic-gradient(var(--accent) 0 50%, var(--bg) 0); }
.prefs summary::-webkit-details-marker { display: none; }
.prefs > div { position: absolute; right: 0; top: 34px; z-index: 5; background: var(--bg); border: 1px solid var(--line); padding: 10px; display: grid; gap: 8px; white-space: nowrap; }
.prefs label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h2 { font-size: 15px; margin: 20px 0 6px; color: var(--muted); }
h3 { font-size: 16px; margin: 24px 0 4px; }
h3 span, a, .link, .code, .add { color: var(--accent); }
input, select, button { font: inherit; }
#q { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.code, .desc, .add, .link { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.code { font-family: ui-monospace, monospace; font-weight: bold; white-space: nowrap; }
.desc { color: var(--fg); }
.add { font-weight: bold; padding: 0 6px; }
table { border-collapse: collapse; width: 100%; }
td { border-top: 1px solid var(--line); padding: 6px 4px; vertical-align: top; }
small, .muted { color: var(--muted); }
p { margin: 4px 0; }
.note { border-left: 3px solid var(--accent); padding-left: 10px; margin: 12px 0; }
ul { padding-left: 20px; }
footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
#sel { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 16px; max-height: 50vh; overflow: auto; }
#sel.empty { display: none; }
@media (min-width: 900px) {
  body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start; padding: 16px 24px; }
  #sel, #sel.empty { display: block; position: sticky; top: 16px; max-height: calc(100vh - 32px); border: 1px solid var(--line); padding: 12px; }
  #sel summary { display: none; }
  #tcount { display: block; margin-bottom: 6px; }
}
#toast { position: fixed; top: 8px; right: 8px; background: var(--fg); color: var(--bg); padding: 4px 10px; font-size: 14px; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<main>
<div class="top">
  <h1>HCC Finder</h1>
  <details class="prefs"><summary aria-label="Color and mode"></summary><div>
    <label>Color <input id="accent" type="color"></label>
    <label>Mode <select id="theme"><option value="">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <button id="reset" type="button">Reset</button>
  </div></details>
</div>
<input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Diagnosis, symptom, abbreviation, or ICD-10 code" aria-label="Search">
<div id="out"><p class="muted">Loading…</p></div>

<footer>
  <p id="src"></p>
  <p><a href="https://robbiemed.org">robbiemed.org</a></p>
  <p>SDG</p>
  <p>Reference only. Code what the note supports.</p>
</footer>
</main>

<aside id="sel" class="empty">
  <b id="tcount"></b>
  <button id="tcopy" type="button">Copy list</button>
  <button id="tcodes" type="button">Copy codes</button>
  <button id="tclear" type="button">Clear</button>
  <details id="seldet"><summary>Show list</summary><div id="tlist"></div></details>
</aside>
<div id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STOP = new Set(["of","the","and","a","an","to","in","for","or","with","nos"]);
  const stem = t => (t.length > 5 && t.endsWith("es")) ? t.slice(0,-2) : (t.length > 6 && t.endsWith("ic")) ? t.slice(0,-2) : (t.length > 4 && t.endsWith("s") && !t.endsWith("ss")) ? t.slice(0,-1) : t;
  const words = s => s.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const toks = s => words(s).filter(t => !STOP.has(t)).map(stem);
  const norm = s => " " + words(s).join(" ") + " ";
  const dot = c => c.length > 3 ? c.slice(0,3) + "." + c.slice(3) : c;
  const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  // --- colors
  const root = document.documentElement;
  let prefs = store.get("hcc-prefs", { accent: null, theme: "" });
  function applyPrefs() {
    if (prefs.theme) root.dataset.theme = prefs.theme; else delete root.dataset.theme;
    if (prefs.accent) root.style.setProperty("--accent", prefs.accent); else root.style.removeProperty("--accent");
    $("accent").value = prefs.accent || getComputedStyle(root).getPropertyValue("--accent").trim();
    $("theme").value = prefs.theme;
    store.set("hcc-prefs", prefs);
  }
  $("accent").addEventListener("input", e => { prefs.accent = e.target.value; applyPrefs(); });
  $("theme").addEventListener("change", e => { prefs.theme = e.target.value; applyPrefs(); });
  $("reset").addEventListener("click", () => { prefs = { accent: null, theme: "" }; applyPrefs(); });
  applyPrefs();

  let D, IDX = [], BY = new Map(), HCCS = {}, SYN = [], VOCAB = new Map(), WORDS = [];
  let picked = store.get("hcc-picked", []);

  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1400); }
  const copy = (text, label) => navigator.clipboard.writeText(text).then(() => toast("Copied " + label), () => toast("Copy failed"));

  function build() {
    HCCS = D.hcc;
    IDX = D.codes.map(r => {
      const h = r[2], labels = h.map(n => (HCCS[n] || {}).l || "").join(" ");
      return { c: r[0], d: r[1], h, x: r[3] || "", e: r[4] || "", td: norm(r[1]), tx: norm((r[3] || "") + " " + labels) };
    });
    for (const r of IDX) BY.set(r.c, r);
    SYN = Object.entries(D.syn).map(([k, v]) => [new RegExp("(^|\\s)" + reEsc(k) + "(?=\\s|$)"), k, v]);
    // spelling vocabulary: every word in the code text, plus every word the clinical layer knows
    const add = s => { for (const w of words(s)) if (w.length > 2 && !/\d/.test(w)) VOCAB.set(w, (VOCAB.get(w) || 0) + 1); };
    for (const r of IDX) { add(r.td); add(r.tx); }
    for (const [k, v] of Object.entries(D.syn)) { add(k); v.forEach(add); }
    for (const s of [...D.symptoms, ...D.notes]) s.terms.forEach(add);
    WORDS = [...VOCAB.keys()].sort();
  }

  // --- spelling correction for words that are neither known nor the start of a known word
  function hasPrefix(w) {
    let lo = 0, hi = WORDS.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (WORDS[m] < w) lo = m + 1; else hi = m; }
    return lo < WORDS.length && WORDS[lo].startsWith(w);
  }
  function lev(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i]; let low = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < low) low = cur[j];
      }
      if (low > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }
  const fixCache = new Map();
  function fixWord(w) {
    if (w.length < 4 || VOCAB.has(w) || hasPrefix(w)) return w;
    if (!fixCache.has(w)) {
      const max = w.length < 8 ? 1 : 2;
      let best = w, bd = max + 1, bf = 0;
      for (const [v, f] of VOCAB) { const d = lev(w, v, max); if (d <= max && (d < bd || (d === bd && f > bf))) { best = v; bd = d; bf = f; } }
      fixCache.set(w, best);
    }
    return fixCache.get(w);
  }
  const fix = q => q.replace(/[a-z]+/g, fixWord);

  function variants(q) {
    const out = [];
    for (const [re, k, exps] of SYN) if (re.test(q)) for (const e of exps) out.push(q.replace(re, "$1" + e));
    return [q, ...new Set(out)];
  }

  function find(q, hccOnly) {
    const res = new Map();
    const codeLike = /^[a-z]\d[0-9a-z]?\.?[0-9a-z]*$/i.test(q.replace(/\s/g, ""));
    if (codeLike) {
      const p = q.replace(/[\s.]/g, "").toUpperCase();
      for (const r of IDX) if (r.c.startsWith(p) && (!hccOnly || r.h.length)) res.set(r.c, { r, s: 100 - r.c.length });
      if (res.size) return res;  // else a code-shaped abbreviation like t2dm, search it as text
    }
    const run = (v, bonus) => {
      const ts = toks(v); if (!ts.length) return;
      const keys = ts.map(t => " " + t);
      for (const r of IDX) {
        if (hccOnly && !r.h.length) continue;
        let inD = 0, ok = true;
        for (const k of keys) { if (r.td.includes(k)) inD++; else if (!r.tx.includes(k)) { ok = false; break; } }
        if (!ok) continue;
        const s = inD * 10 + bonus - r.d.length / 60;
        const prev = res.get(r.c); if (!prev || prev.s < s) res.set(r.c, { r, s, keys });
      }
    };
    variants(q).slice(1).forEach(v => run(v, 0));
    if (!res.size) run(q, 3);  // the raw query only when no abbreviation or synonym expanded it
    const bmi = q.match(/\bbmi\s*(\d{2}(?:\.\d)?)\b/);
    if (bmi && !hccOnly) {
      const b = parseFloat(bmi[1]);
      const c = b < 20 ? "Z681" : b < 40 ? "Z68" + Math.floor(b) : b < 45 ? "Z6841" : b < 50 ? "Z6842" : b < 60 ? "Z6843" : b < 70 ? "Z6844" : "Z6845";
      const r = BY.get(c); if (r) res.set(c, { r, s: 999, keys: [] });
    }
    return res;
  }
  // a code mapped to two HCCs is listed under the one whose label the search hit
  function home(x) {
    if (x.r.h.length < 2 || !x.keys) return x.r.h[0];
    let best = x.r.h[0], n = -1;
    for (const h of x.r.h) { const l = norm(HCCS[h].l); const k = x.keys.filter(k => l.includes(k)).length; if (k > n) { n = k; best = h; } }
    return n > 0 ? best : x.r.h[0];
  }

  const phraseHit = (q, term) => q === term || new RegExp("(^|\\s)" + reEsc(term) + "(\\s|$)").test(q) || (q.length >= 4 && term.startsWith(q));
  const consCache = {};
  function consHccs(q) {
    if (!consCache[q]) { const n = {}; for (const x of find(q, true).values()) { const h = home(x); n[h] = (n[h] || 0) + 1; } consCache[q] = Object.keys(n).sort((a, b) => n[b] - n[a]); }
    return consCache[q];
  }

  function rows(list, inGroup) {
    return "<table>" + list.map(({ r }) => {
      const on = picked.some(p => p.c === r.c);
      const subs = [];
      const other = inGroup != null ? r.h.filter(h => h !== inGroup) : [];
      if (other.length) subs.push("Also HCC " + other.join(", "));
      if (r.e) subs.push("Edit: " + esc(r.e));
      if (r.x) subs.push("Includes: " + esc(r.x));
      return `<tr><td><button class="code" data-copy="${esc(dot(r.c))}" title="Copy code">${esc(dot(r.c))}</button></td>` +
        `<td><button class="desc" data-copy="${esc(r.d)}" title="Copy wording">${esc(r.d)}</button>${subs.length ? `<br><small>${subs.join("<br>")}</small>` : ""}</td>` +
        `<td><button class="add" data-add="${r.c}" aria-pressed="${on}" aria-label="${on ? "Remove from" : "Add to"} list">${on ? "✓" : "+"}</button></td></tr>`;
    }).join("") + "</table>";
  }

  const expanded = new Set();
  function render() {
    const raw = $("q").value, out = $("out");
    let q = raw.trim().toLowerCase().replace(/\s+/g, " ");
    if (q.length < 2) { out.innerHTML = ""; return; }
    const html = [];

    let found;
    const f = fix(q);
    if (f !== q && (found = find(f, false)).size) { q = f; html.push(`<p class="muted">Showing results for <b>${esc(f)}</b></p>`); }
    else found = find(q, false);

    for (const n of D.notes) if (n.terms.some(t => phraseHit(q, t))) html.push(`<p class="note">${esc(n.text)}</p>`);

    const syms = D.symptoms.filter(s => s.terms.some(t => phraseHit(q, t)));
    if (syms.length) {
      html.push(`<h2>Consider</h2><ul>`);
      const seen = new Set();
      for (const s of syms) for (const c of s.consider) {
        if (seen.has(c.q)) continue; seen.add(c.q);
        const hs = consHccs(c.q); if (!hs.length) continue;
        html.push(`<li><button class="link" data-q="${esc(c.q)}">${esc(c.name)}</button> <small>${hs.slice(0, 3).map(n => "HCC " + n).join(", ")}</small>${c.note ? `<br><small>${esc(c.note)}</small>` : ""}</li>`);
      }
      html.push(`</ul>`);
    }

    const res = [...found.values()].sort((a, b) => b.s - a.s);
    const hcc = res.filter(x => x.r.h.length), none = res.filter(x => !x.r.h.length);
    const groups = new Map();
    for (const x of hcc) { const g = home(x); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(x); }
    const order = [...groups.entries()].sort((a, b) => b[1][0].s - a[1][0].s || (HCCS[b[0]].w || 0) - (HCCS[a[0]].w || 0));

    const fold = syms.length > 0 && order.length >= 5;
    if (fold) html.push(`<details><summary>${plural(hcc.length, "HCC code")} matching “${esc(q)}”</summary>`);
    else if (order.length) html.push(`<h2>${plural(hcc.length, "HCC code")} in ${plural(order.length, "HCC")}</h2>`);
    for (const [n, list] of order) {
      const H = HCCS[n], tip = D.tips[n], lim = 8, open = expanded.has(n);
      const hier = [];
      if (H.b.length) hier.push("Outranked by " + H.b.map(n => "HCC " + n).join(", "));
      if (H.t.length) hier.push("Outranks " + H.t.map(n => "HCC " + n).join(", "));
      html.push(`<h3><span>HCC ${n}</span> ${esc(H.l)}${H.w != null ? ` <small>RAF ${H.w.toFixed(3)}</small>` : ""}</h3>` +
        (tip ? `<p>${esc(tip)}</p>` : "") + (hier.length ? `<p class="muted">${hier.join(". ")}.</p>` : "") +
        rows(open ? list : list.slice(0, lim), n) +
        (list.length > lim && !open ? `<p><button class="link" data-more="${n}">Show all ${list.length}</button></p>` : ""));
    }
    if (fold) html.push(`</details>`);

    if (none.length) {
      html.push(`<details${!hcc.length ? " open" : ""}><summary>${plural(none.length, "code")} with no HCC</summary>` +
        rows(none.slice(0, 40)) + (none.length > 40 ? `<p class="muted">First 40 shown.</p>` : "") + `</details>`);
    }
    if (!html.length) html.push(`<p>No matches for “${esc(raw.trim())}”.</p>`);
    out.innerHTML = html.join("");
  }

  function renderTray() {
    // an HCC outranked by another selected HCC drops out of the total, as in the CMS model
    const hs = new Set(picked.flatMap(p => (BY.get(p.c) || { h: [] }).h));
    const out = new Set([...hs].filter(h => HCCS[h].b.some(b => hs.has(b))));
    const raf = [...hs].filter(h => !out.has(h)).reduce((s, h) => s + (HCCS[h].w || 0), 0);
    $("sel").classList.toggle("empty", !picked.length);
    for (const id of ["tcopy", "tcodes", "tclear"]) $(id).disabled = !picked.length;
    $("tcount").textContent = picked.length ? `${picked.length} selected, RAF ${raf.toFixed(3)}` : "No conditions selected";
    $("tlist").innerHTML = picked.map(p => {
      const h = (BY.get(p.c) || { h: [] }).h.map(n => out.has(n) ? `<s>HCC ${n}</s> outranked` : `HCC ${n}`).join(", ");
      return `<p><button class="link" data-rm="${p.c}" aria-label="Remove ${esc(dot(p.c))}">×</button> <code>${esc(dot(p.c))}</code> ${esc(p.d)} <small>${h}</small></p>`;
    }).join("") + (picked.length ? `<p><small>RAF is the sum of HCC weights after hierarchies (community, non-dual, aged). Demographic factors, interaction terms, and the normalization factor are not included.</small></p>` : "");
    store.set("hcc-picked", picked);
  }
  function toggle(c) {
    const i = picked.findIndex(p => p.c === c);
    if (i >= 0) picked.splice(i, 1); else picked.push({ c, d: BY.get(c).d });
    renderTray();
    document.querySelectorAll(`[data-add="${c}"]`).forEach(b => { const on = i < 0; b.setAttribute("aria-pressed", on); b.textContent = on ? "✓" : "+"; });
  }

  let t;
  $("q").addEventListener("input", () => { expanded.clear(); store.set("hcc-last", $("q").value); clearTimeout(t); t = setTimeout(render, 120); });
  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.copy) copy(b.dataset.copy, b.classList.contains("code") ? b.dataset.copy : "wording");
    else if (b.dataset.add) toggle(b.dataset.add);
    else if (b.dataset.rm) toggle(b.dataset.rm);
    else if (b.dataset.q) { $("q").value = b.dataset.q; store.set("hcc-last", b.dataset.q); expanded.clear(); render(); window.scrollTo(0, 0); }
    else if (b.dataset.more) { expanded.add(+b.dataset.more); render(); }
  });
  // the list is always open in the desktop side panel, collapsed in the phone bar
  const wide = matchMedia("(min-width: 900px)"), syncOpen = () => $("seldet").open = wide.matches;
  wide.addEventListener("change", syncOpen); syncOpen();
  $("tcopy").addEventListener("click", () => copy(picked.map(p => `${dot(p.c)} ${p.d}`).join("\n"), `${picked.length} diagnos${picked.length === 1 ? "is" : "es"}`));
  $("tcodes").addEventListener("click", () => copy(picked.map(p => dot(p.c)).join(", "), plural(picked.length, "code")));
  $("tclear").addEventListener("click", () => { picked = []; renderTray(); render(); });

  fetch("data.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    D = d; build();
    $("src").textContent = "Updated " + D.meta.built;
    $("q").value = store.get("hcc-last", ""); render(); renderTray();
  }).catch(err => { $("out").innerHTML = `<p>Couldn't load data.json (${esc(err.message)}).</p>`; });
})();
</script>
</body>
</html>
